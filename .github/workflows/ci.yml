name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0 || pip install torch
      - run: pip install transformers==5.17.0 datasets==5.0.1 scikit-learn==1.9.1 numpy matplotlib pytest ruff sentencepiece protobuf
      - run: ruff check .
      - run: pytest -q
